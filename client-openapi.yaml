openapi: 3.0.3
info:
  title: Litebackup socket API
  version: 1.6.0
  description: The Litebackup client's unix-socket API for SDKs and the litebackup CLI. Every call carries Litebackup-SDK-Version; responses carry Litebackup-Client-Version and Litebackup-Minimum-SDK-Version, and an SDK older than the minimum is denied with 426 sdk_unsupported.
paths:
  /v1/status/show:
    get:
      operationId: showStatus
      description: Session, server, and a page of databases on this machine with its role and state.
      parameters:
        - name: Litebackup-SDK-Version
          in: header
          required: true
          description: the calling SDK's or command's version, optionally after its name, as in typescript/1.1.0; without it the call is denied with 400 invalid_argument, and older than Litebackup-Minimum-SDK-Version with 426 sdk_unsupported
          schema:
            type: string
          x-go-name: SDKVersion
        - in: query
          name: after
          schema:
            type: string
          description: Return names after this cursor in binary sort order.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: success
          headers:
            Litebackup-Client-Version:
              $ref: '#/components/headers/ClientVersion'
            Litebackup-Minimum-SDK-Version:
              $ref: '#/components/headers/MinimumSDKVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '400':
          description: invalid_argument, such as a call without Litebackup-SDK-Version
          headers:
            Litebackup-Client-Version:
              $ref: '#/components/headers/ClientVersion'
            Litebackup-Minimum-SDK-Version:
              $ref: '#/components/headers/MinimumSDKVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '426':
          description: sdk_unsupported, when the calling SDK is older than Litebackup-Minimum-SDK-Version; client_unsupported, when the server denies this client as older than it accepts
          headers:
            Litebackup-Client-Version:
              $ref: '#/components/headers/ClientVersion'
            Litebackup-Minimum-SDK-Version:
              $ref: '#/components/headers/MinimumSDKVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: error
          headers:
            Litebackup-Client-Version:
              $ref: '#/components/headers/ClientVersion'
            Litebackup-Minimum-SDK-Version:
              $ref: '#/components/headers/MinimumSDKVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
