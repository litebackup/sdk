          description: the calling SDK's or command's version, optionally after its name, as in typescript/1.1.0; without it the call is denied with 400 invalid_argument, and older than Litebackup-Minimum-SDK-Version with 426 sdk_unsupported
          schema:
            type: string
          x-go-name: SDKVersion
  /v1/events/list:
    get:
      operationId: listEvents
      description: Events after an event ID, oldest first. With wait_millis, the call waits up to that long for the first new event. Failovers report role_changed and denied here. Every hour the client deletes events older than its --event-retention and the oldest past its --maximum-events. A current path_unreadable event (one per backup rule and path it cannot read) is added again as a new event when its old one goes, so those failures stay and can take the count past --maximum-events.
      responses:
        '200':
          description: success
          headers:
            Litebackup-Client-Version:
              $ref: '#/components/headers/ClientVersion'
            Litebackup-Minimum-SDK-Version:
              $ref: '#/components/headers/MinimumSDKVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '400':
          description: error
          headers:
            Litebackup-Client-Version:
              $ref: '#/components/headers/ClientVersion'
            Litebackup-Minimum-SDK-Version:
              $ref: '#/components/headers/MinimumSDKVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: cursor_expired; the events after the cursor were deleted, so the cursor is older than the oldest event kept. Start again from after=0, or from -1 to follow new events
          headers:
            Litebackup-Client-Version:
              $ref: '#/components/headers/ClientVersion'
            Litebackup-Minimum-SDK-Version:
              $ref: '#/components/headers/MinimumSDKVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '426':
          description: sdk_unsupported, when the calling SDK is older than Litebackup-Minimum-SDK-Version; client_unsupported, when the server denies this client as older than it accepts
          headers:
            Litebackup-Client-Version:
              $ref: '#/components/headers/ClientVersion'
            Litebackup-Minimum-SDK-Version:
              $ref: '#/components/headers/MinimumSDKVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - name: Litebackup-SDK-Version
          in: header
          required: true
          description: the calling SDK's or command's version, optionally after its name, as in typescript/1.1.0; without it the call is denied with 400 invalid_argument, and older than Litebackup-Minimum-SDK-Version with 426 sdk_unsupported
          schema:
            type: string
          x-go-name: SDKVersion
        - name: after
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: return events with IDs greater than this one; -1 returns no events and, as next, the newest event's ID, to follow events from now on
        - name: wait_millis
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int64
  /v1/session/restart:
    post:
      operationId: restartSession
      description: Restart the client in place, in the same process, with the credentials the session saved now, as litebackup up asks after it saved another credential. Syncs under way stop, and write locks stay held under the session's lease. With the same key the client takes the locks up again once it is back. A client holding write locks never starts with another key; up refuses such a credential with drain_required before it saves it, and a client whose saved key changed while it held locks refuses to start, so no upload goes out under a lock taken with another key. A service manager sees no exit. The answer comes before the restart.
      responses:
        '200':
          description: success
          headers:
            Litebackup-Client-Version:
              $ref: '#/components/headers/ClientVersion'
            Litebackup-Minimum-SDK-Version:
              $ref: '#/components/headers/MinimumSDKVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
        '400':
          description: error
          headers:
            Litebackup-Client-Version:
              $ref: '#/components/headers/ClientVersion'
            Litebackup-Minimum-SDK-Version:
              $ref: '#/components/headers/MinimumSDKVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '426':
          description: sdk_unsupported, when the calling SDK is older than Litebackup-Minimum-SDK-Version; client_unsupported, when the server denies this client as older than it accepts
          headers:
            Litebackup-Client-Version:
              $ref: '#/components/headers/ClientVersion'
            Litebackup-Minimum-SDK-Version:
              $ref: '#/components/headers/MinimumSDKVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: error
          headers:
            Litebackup-Client-Version:
              $ref: '#/components/headers/ClientVersion'
            Litebackup-Minimum-SDK-Version:
              $ref: '#/components/headers/MinimumSDKVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - name: Litebackup-SDK-Version
          in: header
          required: true
          description: the calling SDK's or command's version, optionally after its name, as in typescript/1.1.0; without it the call is denied with 400 invalid_argument, and older than Litebackup-Minimum-SDK-Version with 426 sdk_unsupported
          schema:
            type: string
          x-go-name: SDKVersion
  /v1/session/shutdown:
    post:
      operationId: shutdownSession
      description: Final-sync every database this machine writes, wait for the requested durability, release its write lock, end the session, and stop the daemon. It covers every origin that is not conflicted, offloaded, or waiting; a backup another machine writes (waiting) holds no lock, stays waiting, and is not listed. Each covered database it cannot sync, wait for, or release is listed in failures with its code and keeps any write lock it holds; unless wait is none, so is a released acquired copy whose file holds writes the server lacks (changed), and an acquired copy whose file is open again (still_open) or changes during every final sync (changed); then the session stays and the daemon keeps running. Any other failure, such as the timeout ending before the drain could begin, is an error answer.
      responses:
        '200':
          description: success
          headers:
            Litebackup-Client-Version:
              $ref: '#/components/headers/ClientVersion'
            Litebackup-Minimum-SDK-Version:
              $ref: '#/components/headers/MinimumSDKVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShutdownResult'
        '400':
          description: error
          headers:
            Litebackup-Client-Version:
              $ref: '#/components/headers/ClientVersion'
            Litebackup-Minimum-SDK-Version:
              $ref: '#/components/headers/MinimumSDKVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '426':
          description: sdk_unsupported, when the calling SDK is older than Litebackup-Minimum-SDK-Version; client_unsupported, when the server denies this client as older than it accepts
          headers:
            Litebackup-Client-Version:
              $ref: '#/components/headers/ClientVersion'
            Litebackup-Minimum-SDK-Version:
              $ref: '#/components/headers/MinimumSDKVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShutdownRequest'
      parameters:
        - name: Litebackup-SDK-Version
          in: header
          required: true
          description: the calling SDK's or command's version, optionally after its name, as in typescript/1.1.0; without it the call is denied with 400 invalid_argument, and older than Litebackup-Minimum-SDK-Version with 426 sdk_unsupported
          schema:
            type: string
          x-go-name: SDKVersion
components:
  headers:
    ClientVersion:
      description: This client's Litebackup version; on every answer.
      schema:
        type: string
    MinimumSDKVersion:
      description: The oldest SDK version this client serves; on every answer.
      schema:
        type: string
  schemas:
    EventType:
      type: string
      description: 'What happened to a database: role_changed (role is origin or replica, and message is text), draining (a failover origin stops being the origin before a drain releases its lock: its role is unknown until the next role_changed), denied (path names the refused file, such as a failover''s file that holds writes the server lacks), path_unreadable (path names the path a backup rule could not read), and the others by their names.'
      enum:
        - acquired
        - denied
        - download_finished
        - download_started
        - draining
        - image_written
        - local_write
        - lock_lost
        - offloaded
        - path_unreadable
        - rebased
        - released
        - replicating
        - restored
        - reverted
        - role_changed
        - rollback_scan
        - server_generation
        - stopped
        - tracked
      x-enum-varnames:
        - Acquired
        - Denied
        - DownloadFinished
        - DownloadStarted
        - Draining
        - ImageWritten
        - LocalWrite
        - LockLost
        - Offloaded
        - PathUnreadable
        - Rebased
        - Released
        - Replicating
        - Restored
        - Reverted
        - RoleChanged
        - RollbackScan
        - ServerGeneration
        - Stopped
        - Tracked
    Event:
      type: object
      properties:
        id:
          type: integer
          format: int64
        time:
          type: string
          format: date-time
        name:
          type: string
        type:
          $ref: '#/components/schemas/EventType'
        message:
          type: string
        role:
          type: string
          description: for role_changed, the new role
        path:
          type: string
          description: for refused, the refused file; for path_unreadable, the path the rule could not read
      required:
        - id
        - time
        - type
        - message
    SyncedState:
      type: object
      properties:
        version:
          type: integer
          format: int64
        time:
          type: string
          format: date-time
      required:
        - version
      description: A version the server acknowledged. Clients decide what durability is enough.
    ArchivedVersion:
      type: object
      properties:
        version:
          type: integer
          format: int64
        archived:
          type: string
          format: date-time
          description: when the server recorded the version as archived
      required:
        - version
      description: The newest version the server reported the primary bucket holds.
    Durability:
      type: string
      description: 'how far a version must reach: server once the server holds it, cloud once the bucket holds it too'
      enum:
        - server
        - cloud
      x-enum-varnames:
        - Server
        - Cloud
    DatabaseStatus:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
        role:
          type: string
          enum:
            - origin
            - replica
          description: origin when this machine writes the database and backs it up; replica for a live readonly copy
        state:
          type: string
          enum:
            - pending
            - syncing
            - retrying
            - synced
            - waiting
            - offloaded
            - stopped
            - conflicted
            - error
          description: 'pending while a backup or failover origin holds no write lock, as after a start or a drain, until a sync takes it (a start takes back the lock of each backup a drain left pending while the head is still the version it last synced); syncing while changes stream; retrying while an origin''s syncs fail, with error saying why and next_retry when the next attempt runs; synced when the server holds every change: a backup or failover origin whose last sync landed with no change seen after it, until its next change, or a released database whose last version is on the server; waiting while another machine is the origin; offloaded when the local file was removed because the server, or the bucket when the offload asked for it, holds its last version; stopped for a stopped replica; conflicted when this copy was refused and left as it is, because its file differs from the server head or its write lock was lost or broken; error, with error saying why'
        acquired:
          type: boolean
          description: the database is acquired and released by a worker rather than backed up continuously
        failover:
          type: boolean
          description: the database belongs to a failover and changes role when the origin does
        backup_rule_id:
          type: string
          description: the backup or failover rule that tracks the database on this machine; absent for an acquired database and a replica
        local_changed:
          type: boolean
        synced_server:
          $ref: '#/components/schemas/SyncedState'
        synced_cloud:
          $ref: '#/components/schemas/ArchivedVersion'
        journal_mode:
          type: string
          description: wal, rollback, or unknown before the first scan. A full scan of a rollback-journal database holds a read lock that blocks the app's writers until it ends, so it runs at full speed rather than at --scan-bytes-per-second, and the first scan past 256 MB records a rollback_scan event with its duration. Switch such a database to WAL mode (PRAGMA journal_mode = WAL), where scans never block writers; Litebackup never changes the journal mode itself.
        page_count:
          type: integer
          format: int64
        sync_count:
          type: integer
          format: int64
        hint_misses:
          type: integer
          format: int64
        full_scan_reason:
          type: string
        writer_machine_label:
          type: string
          description: the machine label of the last writer this machine saw; empty once this machine released the database, drained it, or offloaded a copy whose write lock it held, as no writer is known then
        error:
          type: string
        failed:
          type: string
          format: date-time
        syncing:
          type: string
          format: date-time
          description: when the first change the server lacks was seen; absent when the server has every change seen. It survives restarts and may be earlier than the real first change, never later.
        retrying:
          type: string
          format: date-time
          description: when the current run of failed syncs began, with the first failure after the last success; absent once a sync succeeds
        synced:
          type: string
          format: date-time
          description: when the newest sync landed, the time synced_server holds
        pending:
          type: string
          format: date-time
          description: when a backup or failover origin was left without its write lock, by a start, a drain, or a dropped lock; absent once a sync takes the lock
        released:
          type: string
          format: date-time
          description: when this machine last released the database
        offloaded:
          type: string
          format: date-time
          description: when the local file was removed because the server or the bucket holds its version; absent once an acquire brings it back
        next_retry:
          type: string
          format: date-time
          description: when the next attempt of a failed sync runs; absent when none is scheduled
        draining:
          type: boolean
          description: set on a failover origin while this machine drains, and on one a drain released, which holds no write lock until it takes one again; a failover then reports its role as unknown, as after a draining event
        machine_label:
          type: string
          description: the name this machine shows on the server and as the writer of its databases
        maintenance:
          type: boolean
        offload_on_release:
          type: boolean
          description: the client deletes the released copy once offload_durability holds it
        offload_durability:
          $ref: '#/components/schemas/Durability'
          description: 'what an offload of this acquired copy waits for: server removes the released copy once the server holds its last version, cloud once the bucket holds it too. An acquire, a release with offload, and an explicit offload each save the durability they asked for. Absent when the database is not acquired'
      required:
        - name
        - path
        - role
        - state
        - acquired
        - failover
        - local_changed
        - synced_server
        - synced_cloud
        - journal_mode
        - page_count
        - sync_count
        - hint_misses
    Status:
      type: object
      properties:
        next:
          type: string
          description: Pass this name as after to read the next page. Omitted on the last page.
        session:
          type: string
        server:
          type: string
        client_version:
          type: string
        session_id:
          type: string
        lease_expires:
          type: string
          format: date-time
        watch:
          type: string
        open_file_limit:
          description: The soft limit on open files the daemon runs with. Each active backup holds about four, and the daemon lowers its default number of active backups to fit.
          type: integer
          format: int64
        unreadable_paths:
          description: the paths a backup rule cannot read, most recent first; the events API has the history
          type: array
          items:
            $ref: '#/components/schemas/Event'
        databases:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseStatus'
      required:
        - session
        - server
        - client_version
        - session_id
        - watch
        - databases
    ErrorCode:
      type: string
      description: 'What went wrong, in one word. The socket answers with file_exists (the file a restore or an acquire would write, or a -journal, -wal, or -shm beside it, already exists), rule_exists (a backup rule with other settings already covers the path, and the error carries that rule), lock_unavailable (another machine holds the write lock a command asks for, as an acquire, a revert, or a failover does), not_found, still_open, invalid_argument, timeout, cursor_expired (an events cursor older than the oldest event kept), changed (an offload or acquire refused because the local file changed under it: written after its last sync, never synced, or written while an acquire replaced it), rule_database (a release of a database a backup rule on this machine keeps, whose write lock the rule never gives up; stop its backup to hand it off), not_durable (an offload refused until the server, or the bucket when it waits for cloud, holds the synced version, or a cloud wait whose name now holds another server database), and the others by their names; busy (a foreground backup refused because another job, a continuous backup, or another machine writes the database), cancelled (a command interrupted before it finished), drain_required (a credential other than the one the client took its write locks with, refused until a drain released them), and launch_failed (the command could not start the client on this machine, or the client exited before it listened) come from the litebackup command alone, which also answers unauthenticated when this machine has not joined a server. A refusal from the server becomes client_unsupported (426: the server needs a newer litebackup on this machine) or, with 503, not_configured (the server waits for setup), wrong_server (the server this machine reached is not the one its session joined, or does not own the database), unauthenticated (the server no longer accepts this machine''s key), forbidden (the key may not do this), plan_limit (the server''s plan has no room for another database), rate_limited (the server sheds load and asks to be tried later: a restore retries it for about 30 seconds, as its Retry-After says, before it answers so), or integrity (the version''s bucket objects failed an integrity check). A restore answers integrity too when every page of the version arrived intact but SQLite''s quick_check finds the database damaged: the version itself is corrupt, so a retry gives the same file, and an earlier version is the way back. A transfer cut short stays unavailable. lock_unavailable, lock_lost, not_found, invalid_argument, and timeout keep their meaning, and any other refusal (a busy server, one short of disk, one unreachable) is unavailable. A client treats a code it does not know as a failure.'
      enum:
        - busy
        - cancelled
        - changed
        - client_unsupported
        - conflict
        - cursor_expired
        - drain_required
        - file_exists
        - forbidden
        - integrity
        - internal
        - invalid_argument
        - launch_failed
        - limit_exceeded
        - lock_lost
        - lock_unavailable
        - method_not_allowed
        - not_configured
        - not_durable
        - not_found
        - plan_limit
        - rate_limited
        - rule_database
        - rule_exists
        - sdk_unsupported
        - still_open
        - timeout
        - unauthenticated
        - unavailable
        - wrong_server
      x-enum-varnames:
        - Busy
        - Cancelled
        - Changed
        - ClientUnsupported
        - Conflict
        - CursorExpired
        - DrainRequired
        - FileExists
        - Forbidden
        - Integrity
        - Internal
        - InvalidArgument
        - LaunchFailed
        - LimitExceeded
        - LockLost
        - LockUnavailable
        - MethodNotAllowed
        - NotConfigured
        - NotDurable
        - NotFound
        - PlanLimit
        - RateLimited
        - RuleDatabase
        - RuleExists
        - SDKUnsupported
        - StillOpen
        - Timeout
        - Unauthenticated
        - Unavailable
        - WrongServer
    BackupRule:
      type: object
      properties:
        id:
          type: string
        path:
          type: string
          description: the path or glob
        name:
          type: string
          description: the resolved remote name for a single file, or empty for a directory or glob
        prefix:
          type: string
        watch:
          type: string
        maximum_local_databases:
          type: integer
          format: int64
        offload_durability:
          $ref: '#/components/schemas/Durability'
          description: what maximum_local_databases waits for before it removes a copy
        offload_rollback_journal:
          type: boolean
        failover:
          type: boolean
      required:
        - id
        - path
        - name
        - prefix
        - watch
        - maximum_local_databases
        - offload_durability
        - offload_rollback_journal
        - failover
    Error:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        rule:
          $ref: '#/components/schemas/BackupRule'
          description: for rule_exists from backup-rules/start, the rule already saved for the path; stop it by its ID before saving different settings
      required:
        - code
        - message
    DatabaseStatusList:
      type: object
      properties:
        next:
          type: string
          description: Pass this name as after to read the next page. Omitted on the last page.
        databases:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseStatus'
      required:
        - databases
    RestorableVersion:
      type: object
      properties:
        version:
          type: integer
          format: int64
        state_digest:
          type: string
        time:
          type: string
          format: date-time
          description: when the version was synced
        archived:
          type: string
          format: date-time
          description: when the server recorded the primary bucket's object of this version as archived; absent when the primary bucket does not hold the version, as for one synced between archive passes, which restores only until history pruning removes its segment
      required:
        - version
        - state_digest
        - time
    VersionList:
      type: object
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/RestorableVersion'
        next:
          type: integer
          format: int64
          description: pass as after to read the next page
      required:
        - versions
    RestoreRequest:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
          description: absolute path of a new file in an existing directory
        version:
          type: integer
          format: int64
          description: the version to restore; the head when neither version nor time is set
        time:
          type: string
          format: date-time
          description: restore the newest version at or before this time
        umask:
          type: integer
          format: int32
          minimum: 0
          maximum: 511
          x-go-type-skip-optional-pointer: false
          description: the caller's file mode creation mask, such as 18 for 022; the file gets 0666 less it, as one the caller created would. Absent uses the client's own umask. The litebackup command sends its own.
      required:
        - name
        - path
    RestoreResult:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
        version:
          type: integer
          format: int64
        page_count:
          type: integer
          format: int64
        page_size:
          type: integer
          format: int64
        state_digest:
          type: string
      required:
        - name
        - path
        - version
        - page_count
        - page_size
        - state_digest
    RevertRequest:
      type: object
      properties:
        name:
          type: string
        version:
          type: integer
          format: int64
          description: the version whose content the new head holds; set version or time
        time:
          type: string
          format: date-time
          description: revert to the newest version at or before this time; set version or time
      required:
        - name
    RevertResult:
      type: object
      properties:
        database:
          $ref: '#/components/schemas/DatabaseStatus'
        source_version:
          type: integer
          format: int64
          description: the version whose content the new head holds; it and every version after it stay restorable
        version:
          type: integer
          format: int64
          description: the new head, one past the head before the revert
        state_digest:
          type: string
          description: the new head's state digest, which is the source version's
      required:
        - database
        - source_version
        - version
        - state_digest
    NameRequest:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    AcquireRequest:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
          description: absolute path of the local file; defaults to the path this machine uses
        maintenance:
          type: boolean
          description: checkpoint and, past the freelist threshold, VACUUM on release
        discard_local:
          type: boolean
          description: replace a local file that diverged from the server head with the head, discarding its writes the head lacks; without it such a file is refused with 409 conflict and left untouched
        offload_on_release:
          type: boolean
          description: lets Litebackup delete the released copy once offload_durability holds it
        offload_durability:
          $ref: '#/components/schemas/Durability'
          description: what an offload of the released copy waits for; server, the default, once the server holds its last version, cloud once the bucket holds it too. A release with offload sets it to the release's durability.
        machine_label:
          type: string
          description: the name this machine shows on the server and as the writer of this database only
        timeout_millis:
          type: integer
          format: int64
          description: bound on downloading the head
        lock_timeout_millis:
          type: integer
          format: int64
          description: how long to wait for the write lock while another machine holds it, trying again until it is released; 0 refuses at once with lock_unavailable. It adds to the timeout.
        umask:
          type: integer
          format: int32
          minimum: 0
          maximum: 511
          x-go-type-skip-optional-pointer: false
          description: the caller's file mode creation mask, such as 18 for 022; a file the acquire creates, the head downloaded where none was or the empty file an offload removed, gets 0666 less it, as one the caller created would. A copy the head replaces keeps its bits. Absent uses the client's own umask. The litebackup command sends its own.
      required:
        - name
    AcquireResult:
      type: object
      properties:
        database:
          $ref: '#/components/schemas/DatabaseStatus'
        decision:
          type: string
          description: what the acquire did to the local file
          enum:
            - created
            - matched
            - resumed
            - downloaded
            - fast_forwarded
            - replaced
      required:
        - database
        - decision
    ReleaseRequest:
      type: object
      properties:
        name:
          type: string
        durability:
          $ref: '#/components/schemas/Durability'
          description: server returns once the final sync is acknowledged; cloud waits for the bucket too
        offload:
          type: boolean
          description: remove the local file once durability holds the released version, the server with server and the bucket with cloud; an offload refused as not_durable is left to a later offload pass
        timeout_millis:
          type: integer
          format: int64
          description: how long to wait for the database to close and for the chosen durability
      required:
        - name
    ReleaseResult:
      type: object
      properties:
        database:
          $ref: '#/components/schemas/DatabaseStatus'
        checkpointed:
          type: boolean
        vacuumed:
          type: boolean
        offloaded:
          type: string
          format: date-time
          description: when the release removed the local file; absent when it kept the file
      required:
        - database
        - checkpointed
        - vacuumed
    OffloadRequest:
      type: object
      properties:
        name:
          type: string
        durability:
          $ref: '#/components/schemas/Durability'
          description: 'what the offload waits for before it removes the copy: server, the default, once the server holds its synced version; cloud once the bucket holds it too. Until then it is refused with not_durable.'
      required:
        - name
    Writer:
      type: object
      properties:
        name:
          type: string
        active:
          type: boolean
          description: whether some machine holds the write lock and its lease still runs
        this_machine:
          type: boolean
          description: whether this machine's session holds the write lock
        writer_machine_label:
          type: string
          description: the machine label of the writer, or empty when nobody holds the lock
        lock_acquired:
          type: string
          format: date-time
          description: when the writer took the lock
        lease_expires:
          type: string
          format: date-time
          description: on the server's clock
        lease_remaining_millis:
          type: integer
          format: int64
          description: how long the lease still runs, negative once it ran out
        lapsed:
          type: boolean
          description: the writer's lease ran out, so another machine may take over
      required:
        - name
        - active
        - this_machine
        - writer_machine_label
        - lapsed
    BackupRequest:
      type: object
      properties:
        path:
          type: string
          description: absolute file, directory, or glob with optional ** segments
        name:
          type: string
          description: the database name for a single path; must already be a valid name
        prefix:
          type: string
          description: name prefix such as app/ (a trailing / is added when missing); names are the prefix plus the relative file path
        watch:
          type: string
          enum:
            - inotify
            - poll
        maximum_local_databases:
          type: integer
          format: int64
          description: when positive, offload the least recently changed idle databases past this count once offload_durability holds them
        offload_durability:
          $ref: '#/components/schemas/Durability'
          description: what maximum_local_databases waits for before it removes a copy; server, the default, once the server holds its last version, cloud once the bucket holds it too
        offload_rollback_journal:
          type: boolean
          description: lets maximum_local_databases offload rollback-journal databases too, on the operator's word that nothing keeps them open while idle; WAL databases are offloaded either way
      required:
        - path
    BackupList:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/BackupRule'
      required:
        - rules
    StopBackupRequest:
      type: object
      minProperties: 1
      maxProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: Exact remote name of a database with its own backup rule on this machine.
        rule_id:
          type: string
          minLength: 1
          x-go-name: RuleID
          description: ID returned by start or listed by rules. Stops the whole rule, including future matches.
    StopBackupResult:
      type: object
      required:
        - lease_pending
      properties:
        lease_pending:
          type: boolean
    FailoverRequest:
      type: object
      properties:
        path:
          type: string
          description: absolute path of the database, the same on every machine
        name:
          type: string
          description: the database name; defaults to the relative file path
        timeout_millis:
          type: integer
          format: int64
          description: bound on the first download of a replica
        discard_local:
          type: boolean
          description: replace a file at the path that differs from the server head with the head, discarding its writes the head lacks; without it such a file is refused with 409 conflict and left untouched
      required:
        - path
    Failover:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
        role:
          type: string
          enum:
            - origin
            - replica
        database:
          $ref: '#/components/schemas/DatabaseStatus'
        writer:
          $ref: '#/components/schemas/Writer'
      required:
        - name
        - path
        - role
        - database
        - writer
    ReplicaRequest:
      type: object
      description: Either name and path, for one database, or prefix and directory, for every database under it.
      properties:
        name:
          type: string
        path:
          type: string
          description: with name, the replica file, defaulting to the path this machine uses
        prefix:
          type: string
          description: name prefix such as app; replicates every database under it
        directory:
          type: string
          description: with prefix, the directory that receives <directory>/<name relative to the prefix>
        write_protection:
          type: string
          enum:
            - lock
            - detect
            - none
          description: lock (default) holds the SQLite write lock so app writes get SQLITE_BUSY while readers carry on; detect rebases after a local write; none trusts apps to open with mode=ro
        timeout_millis:
          type: integer
          format: int64
          description: bound on downloading the first version of a single replica
    PrefixReplica:
      type: object
      properties:
        id:
          type: string
        prefix:
          type: string
        directory:
          type: string
          description: the directory that receives <directory>/<name relative to the prefix>
        write_protection:
          type: string
        database_count:
          type: integer
          format: int64
          description: how many databases under the prefix this machine replicates
      required:
        - id
        - prefix
        - directory
        - write_protection
        - database_count
    ReplicaResult:
      type: object
      description: The replica for a name, or the prefix replica for a prefix.
      properties:
        database:
          $ref: '#/components/schemas/DatabaseStatus'
        prefix_replica:
          $ref: '#/components/schemas/PrefixReplica'
    ReplicaList:
      type: object
      properties:
        prefixes:
          type: array
          items:
            $ref: '#/components/schemas/PrefixReplica'
        replicas:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseStatus'
      required:
        - prefixes
        - replicas
    StopReplicaRequest:
      type: object
      description: Either name for one replica, or prefix and directory for a prefix.
      properties:
        name:
          type: string
        prefix:
          type: string
        directory:
          type: string
          description: with prefix, the directory the prefix replica was started with
    Empty:
      type: object
      properties: {}
      required: []
    EventList:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        next:
          type: integer
          format: int64
          description: pass as after to continue
      required:
        - events
        - next
    ShutdownRequest:
      type: object
      properties:
        durability:
          type: string
          enum:
            - none
            - server
            - cloud
        timeout_millis:
          type: integer
          format: int64
      required: []
    DrainFailure:
      type: object
      properties:
        name:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
      required:
        - name
        - code
        - message
    ShutdownResult:
      type: object
      properties:
        released_count:
          type: integer
          format: int64
          description: how many databases the drain synced as asked and released
        failures:
          type: array
          description: every database the drain could not sync, wait for, or release, each keeping any write lock it holds, and every conflicted copy whose writes are not on the server, with conflict; empty only when the drain released every database it covers, which is the one case the daemon stops
          items:
            $ref: '#/components/schemas/DrainFailure'
      required:
        - released_count
        - failures
