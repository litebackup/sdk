services:
  app:
    build:
      context: ../..
      additional_contexts:
        cli: docker-image://litebackup-cli:pinned
      dockerfile: examples/docker/Dockerfile
    restart: unless-stopped
    environment:
      LITEBACKUP_TOKEN: ${LITEBACKUP_TOKEN:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - databases:/data
      - client-state:/state
volumes:
  databases:
  client-state:
